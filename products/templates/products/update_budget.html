<!-- products/templates/products/update_budget.html -->

{% extends 'products/base.html' %}
{% load static %}

{% block mainpage %}
    <div class="update-budget-container">
        <h1 class="page-title">Обновить бюджет корзины "{{ cart.name }}"</h1>
        <form method="post" class="update-budget-form">
            {% csrf_token %}
            <div class="form-group">
                {{ form.budget.label_tag }}
                {{ form.budget }}
                {% if form.budget.errors %}
                    <div class="error-message">{{ form.budget.errors }}</div>
                {% endif %}
            </div>
            <button type="submit" class="btn btn-primary">Сохранить</button>
        </form>
        <a href="{% url 'products:view_cart' cart_id=cart.id %}" class="btn btn-secondary">Назад к корзине</a>
    </div>
{% endblock %}
